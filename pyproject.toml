[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "orjson>=3.9.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "core*",
    "data*",
    "deribit*",
    "exchanges*",
    "research*",
    "utils*",
    "examples*",
    "tests*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
